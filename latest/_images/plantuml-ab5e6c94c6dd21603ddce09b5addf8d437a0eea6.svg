link style.Style to engine.CheckEngine--><path d="M123.96,123.07 C141.11,125.04 164.19,126.38 189.44,127.09 " fill="none" id="style.Style-&gt;engine.CheckEngine" style="stroke: #A80036; stroke-width: 1.0;"/><polygon fill="#FFFFFF" points="202.15,127.39,196.2484,123.2462,190.1535,127.1,196.0551,131.2438,202.15,127.39" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="11" x="131.7367" y="120.9234">+</text><!--MD5=[6a8b0dacd7ebdb9b49936c203e648313]
@startuml

class source.FilePipe {
    +<<create>>__init__(parser: SourceTree<<type>>, preprocessors: TextProcessor<<type>><<vararg>>)
}


source.FilePipe "*" - -o source.SourceFactory
class source.SourceFactory {
    +{class}add_extension_mapping(extension: String, pipe: source.FilePipe)
    +{class}get_extensions(): String<<iterable>>
    +{class}read_file(source_file: Path|TextIO): source.SourceTree
}


class engine.CheckEngine {
    -styles: Style<<collection>>
    +__init__( styles: Style<<collection>>)
    +check( filename: String <<collection>> ): Issue<<collection>>
    }
style.Style "+" -o engine.CheckEngine


class issue.Issue {
    -description: String
    -filename: Path <<optional>>
    -line: Integer <<optional>>
    +__init__( description: String, line: Integer <<optional>>, filename: Path <<optional>> )
    +__str__(): String
    }

@enduml

